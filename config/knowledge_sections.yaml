# config/knowledge_sections.yaml
#
# Section-to-area/audience map for the Swabi Knowledge Base Source Document v1.0.
# Consumed by scripts/ingest_knowledge.py.
#
# Source format: hand-checked Markdown version of the PDF
# Source path:   docs/knowledge_base.md
# Do not edit this file without re-running ingestion.
#
# ---------------------------------------------------------------------------
# Validation rules (enforced by the ingestion script; a violation fails the run)
# ---------------------------------------------------------------------------
#   * Every resolved chunk must have a `category`, an `area`, an `audience`.
#   * `area` must be one of:     swabi | travel | both
#   * `audience` must be one of: customer | vendor | both
#   * `admin` is NOT a valid audience. If any resolved chunk would carry
#     audience=admin, ingestion exits non-zero and lists the offending
#     section ids.
#   * `id` values across the entire file must be unique, including split
#     children.
#   * Sections with `split_into` ingest only the children; the parent is a
#     container and is not itself emitted as a chunk.
#   * Subsections listed under `skip_subsections` are dropped before
#     chunking and MUST be listed in the ingestion report; a skipped
#     subsection that is not listed causes a non-zero exit.
#   * COVERAGE RULE (split parents only): every subheading in the source
#     under a parent with `split_into` must be claimed by exactly one
#     child via `includes_subsections`. Unclaimed or double-claimed
#     subheadings cause a non-zero exit with the offending ids listed.
#   * `review_flags` are structured objects with `text` and `confirmed`
#     (bool). The ingestion report lists every flag. A `--release` run
#     fails non-zero while any flag has `confirmed: false`.
#   * Source hash integrity: `source_hash_expected` must equal the SHA-256
#     of `source_path`. On mismatch, ingestion exits non-zero and does not
#     write the index. The actual hash is written to `index_version.json`
#     and the ingestion report; it is NOT stored in this file.
#   * `split_into` children of a `travel` area parent inherit
#     `visa_permit_caveat: true` when `destination` is set. Other travel
#     chunks do not trigger the caveat.
#
# ---------------------------------------------------------------------------
# Runtime rules (documented here for reviewers; enforced by the service layer)
# ---------------------------------------------------------------------------
#
#   * Known gaps → answer prompt.
#       `known_gaps` are loaded into the answer prompt as SYSTEM-LEVEL
#       trusted caveats, never as retrieved chunk text. They are read from
#       this file by the prompt builder and inserted into the system
#       message under a heading such as:
#           "KNOWN LIMITATIONS — do not invent values for these:
#              - <gap 1>
#              - <gap 2>"
#       Because they come from the reviewed config and not from retrieval,
#       they cannot be spoofed by document content or the user question.
#       The retrieved chunks are still treated as untrusted data.
#
#   * Tracking-device caveat.
#       review_flags of type "tracking_devices" apply to any chunk whose
#       content describes device behavior. They are also surfaced in the
#       ingestion report so the content owner can confirm the feature is
#       live before the index is released.
#
#   * Visa/permit caveat.
#       Applied at answer time ONLY for travel chunks that carry
#       `destination` (i.e. the five 9.1 children). The caveat text is:
#           "Visa and permit requirements can change. Confirm them with
#            the destination's official immigration or tourism authority
#            before you travel."
#
#   * Forbidden-output filter.
#       The answer validator rejects any string in the generated answer
#       that matches one of these WHOLE-PATH-PREFIX patterns:
#           (?<![\w/])/admin(?:/|$)
#           (?<![\w/])/payments(?:/|$)
#           (?<![\w/])/escrow(?:/|$)
#           (?<![\w/])/devices(?:/|$)
#       A match downgrades the response to
#       answer_type="insufficient_context" with the reason logged.
#       The anchor prevents false positives on ordinary words such as
#       "administrator", "payment terms", "the devices we offer". A unit
#       test asserts both the positive matches and the negative cases.
#
#   * Live marketplace data.
#       Never indexed. User-private state → answer_type="needs_live_data"
#       from a deterministic pre-check plus a SwabiLiveDataAdapter stub.
#       Public package/activity reads go through SwabiClient using the
#       OpenAPI contract to be supplied; resolved at query time, never
#       written to the index.
#
#   * Oversized sections split at subheading boundaries first, then at
#     paragraph boundaries, with the parent heading prepended to each
#     split chunk's text.
#
#   * Golden-facts test (tests/unit/rag/test_golden_facts.py) asserts the
#     following values survive ingestion unchanged:
#         convenience fee 1.5%
#         GST on fees 18%
#         vendor commission 8%
#         discount stacking cap 25%
#         five refund tiers (>30 / 15–30 / 7–14 / <7 / no-show)
#         escrow milestone plan 20 / 40 / 40
#
# ---------------------------------------------------------------------------
# File shape
# ---------------------------------------------------------------------------
# version, source_document, source_version, source_format, source_path,
# source_hash_expected, default_source, last_updated,
#   categories, policy_categories, non_policy_categories,
#   excluded_sections, sections
# ---------------------------------------------------------------------------

version: "1.0.0"

source_document: "Swabi Knowledge Base Source Document"
source_version: "1.0"
source_format: markdown
source_path: docs/knowledge_base.md
# SHA-256 of docs/knowledge_base.md using ingestion text normalization.
source_hash_expected: "c98a0e015b9eabd2838278cb3def69fd28e12d75fb3fc46756ea43afe2136ec8"
default_source: "Swabi Policy KB"
last_updated: "2026-10"

# ---------------------------------------------------------------------------
# Categories — the source document's own section titles, verbatim.
# ---------------------------------------------------------------------------
# Every category must be listed under exactly one of policy_categories or
# non_policy_categories. Runtime retrieval fails closed for unclassified rows.
categories:
  - "PLATFORM POLICIES"                        # Section 1
  - "BIDDING WORKFLOW"                         # Section 2
  - "PAYMENT AND ESCROW"                       # Section 3
  - "CANCELLATION AND REFUNDS"                 # Section 4
  - "WALLET AND PAYOUTS"                       # Section 5
  - "DISPUTE RESOLUTION"                       # Section 6
  - "VENDOR VERIFICATION"                      # Section 7
  - "CUSTOMER, VENDOR, AND ADMIN WORKFLOWS"    # Section 8
  - "TRAVEL KNOWLEDGE"                         # Section 9

# These categories require per-leaf approval and effective-date metadata
# before a release can be built. Travel knowledge is not a platform policy.
policy_categories:
  - "PLATFORM POLICIES"
  - "BIDDING WORKFLOW"
  - "PAYMENT AND ESCROW"
  - "CANCELLATION AND REFUNDS"
  - "WALLET AND PAYOUTS"
  - "DISPUTE RESOLUTION"
  - "VENDOR VERIFICATION"
  - "CUSTOMER, VENDOR, AND ADMIN WORKFLOWS"

non_policy_categories:
  - "TRAVEL KNOWLEDGE"

# ---------------------------------------------------------------------------
# Excluded sections — present in the source document, deliberately not ingested.
# ---------------------------------------------------------------------------
excluded_sections:
  - id: "0"
    title: "PURPOSE AND USAGE OF THIS DOCUMENT"
    reason: >
      Meta-documentation about how the RAG should use this file. Not user
      knowledge. Excluded entirely.
  - id: "8.4"
    title: "Admin and Support Procedures"
    reason: >
      Admin-only operations: internal admin URLs, bank-detail reveal,
      withdrawal approval procedure, dispute handling internals, fraud
      escalation. Not user-facing, not safe to expose to customers or
      vendors.

# ---------------------------------------------------------------------------
# Sections
# ---------------------------------------------------------------------------
# Fields per section:
#   id                  unique identifier ("1.1", "1.4.customer", ...)
#   title               verbatim heading from the document (or a composed
#                       title for split children)
#   category            one of `categories`
#   area                swabi | travel | both
#   audience            customer | vendor | both
#   destination         (optional) travel chunk destination tag
#   activity            (optional) travel chunk activity tag
#   known_gaps          (optional) list of strings; trusted caveats
#   review_flags        (optional) list of {text, confirmed}
#   policy_lifecycle    (required for release policies): policy_id, status,
#                       effective_from, optional expires_on and supersedes
#   skip_subsections    (optional) subheadings to drop before chunking
#   split_into          (optional) list of child sections; the parent is not
#                       emitted as a chunk when this is present
# ---------------------------------------------------------------------------

