[project]
name = "Swabi-AI-V1"
version = "0.1.0"
description = "Swabi AI Travel Assistant — Phase 0 AI Foundation"
requires-python = ">=3.12,<3.13"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: tests that call live external providers (opt-in)",
]

[tool.ruff.lint.per-file-ignores]
# Prompts are single opaque strings whose bytes are hashed into a
# version identifier. They must not be reflowed by line-length rules.
"app/capabilities/chat_safety/prompts.py" = ["E501"]
"app/capabilities/enquiry/prompts.py" = ["E501"]
"app/capabilities/support/prompts.py" = ["E501"]
